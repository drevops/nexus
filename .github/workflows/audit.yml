name: Audit

on:
  schedule:
    - cron: '37 5 * * 1'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  branch_protection_rule:

permissions: {}

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    # Scorecard runs only its local checks on a pull request, so code scanning
    # misses 2 of the categories main uploads and reports a neutral result.
    if: ${{ github.event_name != 'pull_request' }}

    permissions:
      actions: read
      contents: read
      id-token: write # Sign the results published to the Scorecard API.
      security-events: write # Upload the results to code scanning.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Audit security practices with OpenSSF Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the audit results to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif

  security:
    name: Security
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'branch_protection_rule' }}

    permissions:
      actions: read
      contents: read
      security-events: write # Upload the results to code scanning.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The vendored builds are checked against npm by 'npm run check-vendor'.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: actions,javascript-typescript
          build-mode: none
          config: |
            paths-ignore:
              - assets/vendor

      - name: Scan code for vulnerabilities with CodeQL
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
