name: Benchmark

on:
  workflow_dispatch:
    inputs:
      base:
        description: Commit, branch or tag to compare with; leave empty for the latest release
        type: string
        default: ''

permissions: {}

# A new run on the same branch replaces the one in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 26

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The latest release excludes drafts and prereleases. A repository with
      # no release yet has no base, so the branch is measured alone, while a
      # failed lookup fails the step. The checkout keeps other branches only
      # as remote-tracking refs.
      - name: Pick the base commit
        id: base
        run: |
          ref="$INPUT_BASE"
          if [ -z "$ref" ]; then
            ref=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')
          fi
          sha=''
          if [ -n "$ref" ]; then
            sha=$(git rev-parse --verify --quiet --end-of-options "${ref}^{commit}" || git rev-parse --verify --quiet --end-of-options "refs/remotes/origin/${ref}^{commit}" || true)
            if [ -z "$sha" ]; then
              echo "::error::${ref} is not a commit in this repository."
              exit 1
            fi
          fi
          echo "Base: ${ref:-none} ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BASE: ${{ inputs.base }}

      # The script's defaults apply while a variable is unset.
      - name: Run the benchmark
        run: npm run benchmark -- --runs 7 ${BASE_SHA:+--base-ref "$BASE_SHA"} ${THRESHOLD:+--threshold "$THRESHOLD"} ${MIN_DIFF:+--min-diff "$MIN_DIFF"}
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          THRESHOLD: ${{ vars.BENCHMARK_THRESHOLD }}
          MIN_DIFF: ${{ vars.BENCHMARK_MIN_DIFF }}

      - name: Add the report to the job summary
        if: always()
        run: |
          if [ -f .artifacts/benchmark/benchmark.md ]; then
            cat .artifacts/benchmark/benchmark.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report as an artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark
          path: .artifacts/benchmark
          if-no-files-found: warn
