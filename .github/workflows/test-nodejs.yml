name: Test Node.js

on:
  schedule:
    - cron: '23 4 * * *'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions: {}

# A pull request push cancels its superseded run; pushes and manual runs on a
# branch share 1 queue, so the newest commit deploys last. Scheduled runs get
# their own group, so they never replace a queued deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'schedule' && 'schedule') || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 26

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check coding standards
        run: npm run lint
        continue-on-error: ${{ vars.CI_LINT_IGNORE_FAILURE == '1' }}

  test-unit:
    name: Unit
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm run test-coverage
        continue-on-error: ${{ vars.CI_TEST_IGNORE_FAILURE == '1' }}

      - name: Check code coverage threshold
        run: |
          RATE=$(grep -o 'line-rate="[0-9.]*"' .logs/cobertura-coverage.xml | head -1 | tr -cd '0-9.')
          PERCENT=$(awk "BEGIN {printf \"%.2f\", $RATE*100}")
          echo "Coverage: $PERCENT% (threshold: $CI_CODE_COVERAGE_THRESHOLD%)"
          if [[ ! $CI_CODE_COVERAGE_THRESHOLD =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "FAIL: CI_CODE_COVERAGE_THRESHOLD must be a non-negative number"
            exit 1
          fi
          if awk -v p="$PERCENT" -v t="$CI_CODE_COVERAGE_THRESHOLD" 'BEGIN { exit !(p + 0 < t + 0) }'; then
            echo "FAIL: coverage too low"
            exit 1
          fi
        env:
          CI_CODE_COVERAGE_THRESHOLD: ${{ vars.CI_CODE_COVERAGE_THRESHOLD || '80' }}

      - name: Upload coverage report as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{github.job}}-code-coverage-report
          path: .logs
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: env.CODECOV_TOKEN != ''
        with:
          files: .logs/cobertura-coverage.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Check vendored libraries against npm
        run: npm run check-vendor

  test-e2e:
    name: E2E ${{ matrix.runner }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # Each spec file's top-level describe carries 1 '@runner-N' tag.
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test-e2e -- --grep @runner-${{ matrix.runner }}
        continue-on-error: ${{ vars.CI_TEST_IGNORE_FAILURE == '1' }}

  deploy:
    name: Deploy to Netlify
    needs:
      - lint
      - test-unit
      - test-e2e
    if: github.event_name != 'schedule' && vars.NETLIFY_SITE_ID != ''
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write # 'actions-netlify' posts the deploy URL as a pull request comment.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Assemble static site
        run: npm run assemble

      - name: Deploy to Netlify
        if: env.NETLIFY_AUTH_TOKEN != ''
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-dir: _site
          production-branch: main
          alias: ${{ github.event_name == 'pull_request' && format('deploy-preview-{0}', github.event.pull_request.number) || '' }}
          deploy-message: 'Deploy from GitHub Actions'
          enable-pull-request-comment: true
          overwrites-pull-request-comment: true
          enable-commit-comment: false
          enable-commit-status: false
          enable-github-deployment: false
        env:
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        timeout-minutes: 5
