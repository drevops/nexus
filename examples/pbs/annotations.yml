# Optional annotation overlay for the PBS content model.
#
# These elements are architecture annotations that cannot be derived from
# Drupal configuration. They demonstrate the full visual language: Event
# (diamond), API (hexagon) and Callback (method) nodes, explicit edges, and
# calculated fields.
title: 'PBS content model'

nodes:
  - { id: recording_api, kind: api, label: 'Recording API' }
  - { id: omny_api, kind: api, label: 'Omny Studio API' }
  - { id: create_episodes, kind: callback, label: 'Create future episodes', method: POST, attach: node.program }
  - { id: sync_program, kind: callback, label: 'Sync program', method: PATCH, attach: node.program }
  - { id: episode_published, kind: event, label: EpisodePublished, attach: node.episode }

edges:
  - { from: create_episodes, to: node.episode, label: creates }
  - { from: sync_program, to: recording_api, label: syncs }
  - { from: node.episode, to: omny_api, label: audio }
  - { from: episode_published, to: omny_api, label: notifies }

computed_fields:
  node.episode:
    - { name: audio_url, label: 'Audio URL' }
  node.program:
    - { name: episode_count, label: 'Episode count' }
