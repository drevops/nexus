id: music_interview_form
title: 'Music and Interview Submission Form'
description: '<p>A form to allow users to request Music and/or Interviews.</p>'
categories: {  }
elements: |-
  request_type:
    '#type': radios
    '#title': 'Request type'
    '#options':
      'Submit music': 'Submit music'
      'Request an interview': 'Request an interview'
      'Submit music and request an interview': 'Submit music and request an interview'
    '#options_display': buttons
    '#required': true
    '#default_value': 'Submit music'
  first_name_and_last_name:
    '#type': textfield
    '#title': 'First Name and Last Name'
    '#required': true
  email:
    '#type': email
    '#title': Email
    '#required': true
  phone_number:
    '#type': textfield
    '#title': 'Phone Number'
  location:
    '#type': address
    '#title': Location
    '#field_overrides':
      givenName: hidden
      additionalName: hidden
      familyName: hidden
      organization: hidden
      addressLine1: hidden
      addressLine2: hidden
      addressLine3: hidden
      postalCode: hidden
      sortingCode: hidden
      dependentLocality: hidden
    '#required': true
  artist_or_band_name:
    '#type': textfield
    '#title': 'Artist or Band Name'
    '#required': true
  release_name:
    '#type': textfield
    '#title': 'Release Name'
    '#states':
      optional:
        ':input[name="request_type"]':
          value: 'Request an interview'
  release_date:
    '#type': date
    '#title': 'Release Date'
    '#states':
      optional:
        ':input[name="request_type"]':
          value: 'Request an interview'
  is_it_available_for_airplay_now:
    '#type': select
    '#title': 'Is it available for airplay now?'
    '#options':
      'Available for airplay now': 'Available for airplay now'
      'Under strict embargo until release date': 'Under strict embargo until release date'
    '#states':
      optional:
        ':input[name="request_type"]':
          value: 'Request an interview'
  genre:
    '#type': webform_term_select
    '#title': Genre
    '#vocabulary': genres
    '#target_type': taxonomy_term
    '#selection_handler': 'default:taxonomy_term'
    '#selection_settings':
      target_bundles:
        genres: genres
      sort:
        field: name
        direction: asc
    '#required': true
  subgenres:
    '#type': webform_term_select
    '#title': Subgenres
    '#vocabulary': subgenres
  label:
    '#type': textfield
    '#title': Label
  format:
    '#type': select
    '#title': Format
    '#options':
      Single: Single
      Double-single: Double-single
      EP: EP
      Album: Album
      Compilation: Compilation
      Box-set: Box-set
    '#states':
      optional:
        ':input[name="request_type"]':
          value: 'Request an interview'
  artist_gender_gender_distribution_in_band:
    '#type': checkboxes
    '#title': 'Artist Gender / Gender distribution in band'
    '#options':
      Male: Male
      Female: Female
      GNC: GNC
  artist_biography:
    '#type': textarea
    '#title': 'Artist Biography'
    '#description': '<p>Please add a short bio about your act.</p>'
    '#counter_type': word
    '#counter_maximum': 200
    '#required': true
  reason_for_interview:
    '#type': textarea
    '#title': 'Reason for Interview'
    '#states':
      invisible:
        ':input[name="request_type"]':
          value: 'Submit music'
  epk:
    '#type': url
    '#title': EPK
    '#description': "<p>Please provide a link to your Electronic Press Kit (EPK). An EPK is typically a Dropbox, Google Drive, Disco or WeTransfer link of your promotional assets that includes: a) recent or forthcoming examples of your music (MP3s/WAVs/AIFFs); hi-res press shots and/or album art; a recent press release containing an expanded artist biography and, if relevant, information about upcoming shows and events. If press shots and a press release aren't available then music downloads will suffice.</p>"
    '#required': true
  pbs_programs_relevant_for_your_music:
    '#type': webform_entity_checkboxes
    '#title': 'PBS Programs relevant for your music'
    '#multiple': 5
    '#description': '<p>Nominate up to 5 PBS Programs to pitch your music to.</p>'
    '#options_display': three_columns
    '#required': true
    '#target_type': node
    '#selection_handler': 'default:node'
    '#selection_settings':
      target_bundles:
        program: program
  event_info:
    '#type': textarea
    '#title': 'Event info'
    '#description': '<p>If there is a launch event for your release please provide details here.</p>'
    '#states':
      invisible:
        ':input[name="request_type"]':
          value: 'Request an interview'
  social_media_links:
    '#type': fieldset
    '#title': 'Social Media Links'
    social_media_facebook:
      '#type': url
      '#title': Facebook
    social_media_instagram:
      '#type': url
      '#title': Instagram
    social_media_youtube:
      '#type': url
      '#title': YouTube
    social_media_soundcloud:
      '#type': url
      '#title': SoundCloud
  live_video:
    '#type': url
    '#title': 'Live video'
    '#description': '<p>If you have a live perfomance video, please link to it here.</p>'
  are_you_a_current_pbs_member:
    '#type': checkbox
    '#title': 'Are you a current PBS Member?'
    '#description': "<p>This is purely for our records, and in no way informs whether you receive airplay or not. If you're not a PBS Member, you can join here (link)</p>"
  pbs_enews:
    '#type': checkbox
    '#title': 'Yes, sign me up to get the PBS eNews!'
    '#description': '<p>Would you like to get weekly updates from PBS?</p>'
